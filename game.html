<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2b2b2b">
<title>タイピング - スーパージュク</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>漢</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;800&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="game.css">
</head>
<body>
<div class="app">

  <!-- SETUP -->
  <section class="screen" id="screen-setup">
    <header class="topbar">
      <a class="icon-btn icon-btn-text game-link" href="index.html" aria-label="ホーム">戻る</a>
      <span class="screen-title">タイピング</span>
      <span class="icon-btn-spacer"></span>
    </header>
    <div class="game-setup">
      <p class="game-intro">言葉が上から落ちてきます。下に着く前に読み方か意味を入力してください。</p>
      <div class="legend">
        <div class="legend-row">
          <span class="legend-tile tile kind-reading tone-pink"><span class="tile-head"><span class="tile-badge">あ</span></span><span class="legend-term">読</span></span>
          <span><b>丸いバッジ</b> = 読み方をかなで（ローマ字可）</span>
        </div>
        <div class="legend-row">
          <span class="legend-tile tile kind-meaning tone-pink"><span class="tile-head"><span class="tile-badge">A</span></span><span class="legend-term">意</span></span>
          <span><b>四角いバッジ</b> = 意味を英語で</span>
        </div>
        <div class="legend-row legend-colours">
          <span class="tone-chip tone-pink">ピンク</span> 漢字そのもの
          <span class="tone-chip tone-purple">紫</span> 単語
          <span class="tone-chip tone-teal">青緑</span> 名詞
        </div>
      </div>

      <label class="game-field">
        <span class="game-field-label">デッキ</span>
        <select id="deckSelect"></select>
      </label>

      <div class="game-field">
        <span class="game-field-label">問題</span>
        <div class="seg" id="typeSeg">
          <button type="button" data-value="all">すべて</button>
          <button type="button" data-value="reading">読み方</button>
          <button type="button" data-value="meaning">意味</button>
        </div>
      </div>

      <div class="game-field">
        <span class="game-field-label">問題数</span>
        <div class="seg" id="countSeg">
          <button type="button" data-value="10">10</button>
          <button type="button" data-value="20">20</button>
          <button type="button" data-value="40">40</button>
          <button type="button" data-value="80">80</button>
          <button type="button" data-value="all">全部</button>
        </div>
      </div>

      <div class="game-field">
        <span class="game-field-label">速さ</span>
        <div class="seg" id="speedSeg">
          <button type="button" data-value="slow">ゆっくり</button>
          <button type="button" data-value="normal">ふつう</button>
          <button type="button" data-value="fast">はやい</button>
        </div>
      </div>

      <p class="game-note" id="deckNote"></p>
      <button class="mode-btn game-start" id="startBtn" type="button"><span class="mode-label">スタート</span></button>
    </div>
  </section>

  <!-- PLAY -->
  <section class="screen" id="screen-play" hidden>
    <header class="topbar game-hud">
      <button class="icon-btn icon-btn-text" id="pauseBtn" type="button" aria-label="一時停止">停止</button>
      <div class="hud-stats">
        <span class="hud-score"><span id="hudScore">0</span></span>
        <span class="hud-combo" id="hudCombo"></span>
      </div>
      <div class="hud-counts">
        <span class="hud-right">○ <span id="hudRight">0</span></span>
        <span class="hud-wrong">× <span id="hudWrong">0</span></span>
        <span class="hud-left">残り <span id="hudLeft">0</span></span>
      </div>
    </header>
    <div class="field" id="field">
      <div class="danger-line"></div>
      <div class="pause-overlay" id="pauseOverlay" hidden>
        <div class="pause-box">
          <div class="pause-title">一時停止</div>
          <button class="mode-btn" id="resumeBtn" type="button"><span class="mode-label">続ける</span></button>
          <button class="mode-btn mode-btn-quiet" id="quitBtn" type="button"><span class="mode-label">やめる</span></button>
        </div>
      </div>
      <div class="countdown" id="countdown" hidden></div>
    </div>
    <form class="game-input" id="inputForm" autocomplete="off">
      <input id="answerInput" type="text" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" placeholder="答え / Answer" aria-label="答え">
      <span class="kana-preview" id="kanaPreview"></span>
    </form>
  </section>

  <!-- RESULTS -->
  <section class="screen" id="screen-results" hidden>
    <header class="topbar">
      <a class="icon-btn icon-btn-text game-link" href="index.html" aria-label="ホーム">ホーム</a>
      <span class="screen-title">結果</span>
      <span class="icon-btn-spacer"></span>
    </header>
    <div class="game-results">
      <div class="result-score" id="resultScore">0</div>
      <div class="result-line" id="resultLine"></div>
      <div class="result-buttons">
        <button class="mode-btn" id="againBtn" type="button"><span class="mode-label">もう一度</span></button>
        <button class="mode-btn" id="missesBtn" type="button"><span class="mode-label">間違いだけ</span></button>
        <button class="mode-btn mode-btn-quiet" id="setupBtn" type="button"><span class="mode-label">設定</span></button>
      </div>
      <h2 class="result-heading" id="missHeading">間違い</h2>
      <ul class="miss-list" id="missList"></ul>
    </div>
  </section>

</div>
<script src="https://cdn.jsdelivr.net/npm/wanakana@5.3.1/wanakana.min.js"></script>
<script src="game.js"></script>
</body>
</html>
